name: 1GP CI build
on:
  pull_request:
    branches:
      - release
      - '*.*.x'

  merge_group:
    types: [changes_requested]

  workflow_dispatch:
    inputs:
      clean-org:
        description: |
          ( true | false ) Whether to use a clean org or an org from OrgFarm.
          Defaults to using an OrgFarm org.
        required: false
        type: boolean
        default: false

      preserve-org:
        description: |
          ( true | false ) Whether to preserve the org after the workflow completes.
          Auth information is stored in the build artifacts.
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      skip-validation:
        description: |
          ( true | false ) Whether to skip validation when creating the package version.
          Default is to skip validation.
        required: false
        default: true
        type: boolean

      ref:
        description: |
          The branch to use for the workflow.
          Defaults to the branch the workflow was triggered from.
        required: false
        type: string

    outputs:
      package-receipt:
        description: ( markdown ) The GitHub Step Summary from CI-build-and-test.
        value: ${{ jobs.CI-build-and-test.outputs.package-receipt }}

      package-version-id:
        description: The Package version id for the package version created.
        value: ${{ jobs.CI-build-and-test.outputs.package-version-id}}

      auto-promote:
        description: Whether to auto promote the package
        value: 'false'

permissions:
  id-token: write # This is required for requesting the ID token for AWS actions
  contents: read # This is required for actions/checkout

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

env:
  DEVOPS_SCRIPTS_PATH: './devops-utility-belt/scripts'
  GIT_BASE_BRANCH: ${{ github.base_ref }}
  GIT_BRANCH: ${{ github.head_ref }}
  RELEASE_FULLNAME: nCino Companies House (UK)
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  Path-Filtering:
    outputs:
      apex-changed: ${{ steps.path-filtering.outputs.apex-changed }}
      markdown-changed: ${{ steps.path-filtering.outputs.markdown-changed }}
      non-markdown-changed: ${{ steps.path-filtering.outputs.non-markdown-changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🫥 Checkout repo 😐
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: 'sfdx-project.json'

      - name: Get Namespace
        id: get-namespace
        run: echo "NAMESPACE=$(jq -r '.namespace' sfdx-project.json)" >> $GITHUB_OUTPUT

      # Uses the action by @dorny to filter paths
      # More info can be found at https://github.com/dorny/paths-filter
      - name: Run Path Filtering
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # current version 3.0.2
        id: path-filtering
        with:
          filters: |
            apex-changed:
              - "src/${{ steps.get-namespace.outputs.NAMESPACE }}/**/*.cls"
              - "src/${{ steps.get-namespace.outputs.NAMESPACE }}/**/*.trigger"
              - "src/${{ steps.get-namespace.outputs.NAMESPACE }}/**/*.component"
              - "src/${{ steps.get-namespace.outputs.NAMESPACE }}/**/*.page"
              - "src/${{ steps.get-namespace.outputs.NAMESPACE }}/**/*.*-meta.xml"
            markdown-changed:
              - '**/*.md'
            non-markdown-changed:
              - '!**/*.md'
          list-files: 'json'
          token: ${{ steps.app-token.outputs.token }}

  CI-build-and-test:
    needs: Path-Filtering
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      #######################################################
      ######   🚧 SETUP AND INSTALL DEPENDENCIES 📀    ######
      #######################################################
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.ref }}

      - name: 🛠️ Force Repository Setup 🛠️
        uses: ncino/action-force-setup@v4
        with:
          ci-github-app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          ci-github-app-private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}
          ci-ncino-ssh-private-signing-key: ${{ secrets.CI_NCINO_SSH_PRIVATE_SIGNING_KEY }}
          ci-ncino-ssh-public-signing-key: ${{ secrets.CI_NCINO_SSH_PUBLIC_SIGNING_KEY }}
          dev-hub-auth-url: ${{ secrets.DEVOPS_DEV_HUB_AUTH_URL }}
          ncino-cli-install: 'true'
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          setup-1password: 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.CI_USER_REPO_ACCESS_TOKEN }}

      #######################################################
      ######          🏗️ BUILD AND PACKAGE 📦          ######
      #######################################################
      - name: 🕵️‍♀️ Validate config XML 🕵️‍♀️
        if: ${{ needs.Path-Filtering.outputs.non-markdown-changed == 'true' }}
        uses: ncino/action-validate-xml@v1

      # Uncomment if you have Angular or AngularJS jest tests
      # - name: 🧪 Run Angular Tests 🧪
      #   run: npm run test

      # Uncomment once tests have been applied
      # Some repos may need to change this to test:lwc
      # - name: 🧑‍🎤 Run npm test:unit script 👩‍🎤
      #   run: npm run test:unit

      - name: 👩‍🌾 Get orgfarm org 👨‍🌾
        id: setup-org
        if: ${{ needs.Path-Filtering.outputs.apex-changed == 'true' }}
        uses: ncino/action-org-setup/org-provision-action@v5
        with:
          clean-org: ${{ inputs.clean-org }}
          has-namespace: true
          github-token: ${{ secrets.CI_USER_REPO_ACCESS_TOKEN }}
          orgfarm-api-key: '${{ secrets.ORG_FARM_API_KEY }}'
          orgfarm-api-url: ${{ vars.ORGFARM_API_URL }}
          preserve-org: ${{ inputs.preserve-org }}
          sftd-api-key: ${{ secrets.SFTD_API_KEY }}
          skip-npm-install: 'true'
          skip-python-install: 'true'

      - name: 🚢 Deploy source and encrypt 💼
        if: ${{ needs.Path-Filtering.outputs.apex-changed == 'true' }}
        uses: ncino/action-org-setup/org-source-push-action@v5

      - name: 🧪 Force Apex Tests 🧪
        if: ${{ needs.Path-Filtering.outputs.apex-changed == 'true' }}
        uses: ncino/action-force-apex-tests@v4
        with:
          auth-url: ${{ steps.setup-org.outputs.auth-url }}
          skip-python-install: 'true'

      #######################################################
      ######         🧼 POST-BUILD CLEANUP 🧹          ######
      #######################################################
      # 🏁 Artifact Upload Phase 🏁
      - name: 🤙 Upload Artifact and trigger packaging 🏄‍♂️
        if: ${{ github.ref_name == 'release' && success() }}
        uses: ncino/action-aws/s3_trigger_pipeline@v3
        with:
          commit-sha1: ${{ env.COMMIT_SHA1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.CI_USER_REPO_ACCESS_TOKEN }}

      - name: 🧹 Post Build Cleanup 🧹
        if: always()
        continue-on-error: true
        uses: ncino/action-org-setup/org-cleanup-action@v5
        with:
          orgfarm-api-url: ${{ vars.ORGFARM_API_URL }}
          orgfarm-api-key: '${{ secrets.ORG_FARM_API_KEY }}'
          preserve-org: ${{ inputs.preserve-org }}

      - name: 📝 Export Summary 📝
        id: summary
        run: |
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$(cat $GITHUB_STEP_SUMMARY)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 👏 Success Message 👏
        if: success()
        run: cat $DEVOPS_SCRIPTS_PATH/config/deploy_message.txt
