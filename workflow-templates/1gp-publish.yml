name: 📚 1GP Publish 📝
on:
  push:
    branches:
      - release

env:
  DELIVERY_SCRIPTS_PATH: './devops-utility-belt/scripts'
  FAILURE_SLACK_CHANNEL: 'oof'
  GIT_BRANCH: ${{ github.ref_name }}
  REPO_NAME: ${{ github.event.repository.name }}
  QA_SLACK_CHANNEL: 'qa-notifications'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  Commit-Lint:
    name: 📝 Commit Lint 📝
    uses: ./.github/workflows/commit-lint.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write

  Get-Package-Info:
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.get-package-info.outputs.package-name }}
      package-namespace: ${{ steps.get-package-info.outputs.package-namespace }}
      subscriber-package-id: ${{ steps.get-package-info.outputs.subscriber-package-id }}
      sfdx-project-json: ${{ steps.get-package-info.outputs.sfdx-project-json }}
    steps:
      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v5

      - name: Get Package Info
        id: get-package-info
        uses: ./.github/actions/getPackageInfo

  Sync-And-Transition-Tickets:
    name: ⚔️🐠 Sync and Transition Tickets ⚔️🐠
    needs: [Commit-Lint, Get-Package-Info]
    if: needs.Commit-Lint.outputs.release != 'NONE'
    runs-on: ubuntu-latest
    outputs:
      jira-ticket-ids: ${{ steps.parse-inputs.outputs.jira-ticket-ids }}
      tag: ${{ steps.swordfish-synchronizer.outputs.next-version }}
    steps:
      - name: ☁️ Create GitHub App Token 🔓
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: ⚔️🐠 Swordfish Synchronizer ⚔️🐠
        id: swordfish-synchronizer
        uses: ncino/action-swordfish/synchronizer@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          packaging-org-auth-url: ${{ secrets.PACKAGING_ORG_AUTH_URL }}
          namespace-prefix: ${{ needs.Get-Package-Info.outputs.package-namespace }}
          spa-api-key: ${{ secrets.SPA_API_KEY }}
          spa-api-url: ${{ vars.SPA_API_URL }}

      - name: Print Outputs
        run: |
          echo "Previous Release was $PREVIOUS_RELEASE"
          echo "Next Release is $NEXT_RELEASE"
        env:
          PREVIOUS_RELEASE: ${{ steps.swordfish-synchronizer.outputs.previous-version }}
          NEXT_RELEASE: ${{ steps.swordfish-synchronizer.outputs.next-version }}

      - name: Run the Jira parsing action
        id: parse-inputs
        uses: ncino/action-jira-issue-parser@v3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          jira-user: ${{ secrets.JIRA_USER }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          jira-base-url: ${{ vars.ATLASSIAN_BASE_URL }}
          previous-release: ${{ steps.swordfish-synchronizer.outputs.previous-version }}
          current-release: ${{ github.sha }}

      - name: 🪬 Transition Jira Tickets to Packaging
        uses: ncino/action-jira-transition@v1
        env:
          JIRA_TRANSITION_WEBHOOK: ${{ secrets.JIRA_TRANSITION_WEBHOOK }}
          JIRA_TRANSITION_SECRET: ${{ secrets.JIRA_TRANSITION_SECRET }}
          RELEASE_FULLNAME: ${{ needs.Get-Package-Info.outputs.package-name }}
        with:
          issue-ids: ${{ steps.parse-inputs.outputs.jira-ticket-ids }}
          new-status: 'Packaging'

  Package-Create:
    name: 🚀 Deploy Package and Upload in Packaging Org 🚀
    needs: [Get-Package-Info, Sync-And-Transition-Tickets]
    outputs:
      package-version-info: ${{ steps.upload-package.outputs.package-version-info }}
    runs-on: ubuntu-latest
    env:
      BUILD_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PACKAGE_LABEL: ${{ needs.Get-Package-Info.outputs.package-name }} ${{ needs.Sync-And-Transition-Tickets.outputs.tag }}
      PACKAGE_NAME: ${{ needs.Get-Package-Info.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.Sync-And-Transition-Tickets.outputs.tag }}
      SUBSCRIBER_PACKAGE_ID: ${{ needs.Get-Package-Info.outputs.subscriber-package-id }}
    steps:
      - name: ☁️ Create GitHub App Token 🔓
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 🛠️ Force Repository Setup 🛠️
        uses: ncino/action-force-setup@v4
        with:
          ci-github-app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          ci-github-app-private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}
          ci-ncino-ssh-private-signing-key: ${{ secrets.CI_NCINO_SSH_PRIVATE_SIGNING_KEY }}
          ci-ncino-ssh-public-signing-key: ${{ secrets.CI_NCINO_SSH_PUBLIC_SIGNING_KEY }}
          dev-hub-auth-url: ${{ secrets.DEVOPS_DEV_HUB_AUTH_URL }}
          ncino-cli-install: 'true'
          ncino-cli-version: ${{ vars.NCINO_CLI_VERSION }}
          setup-salesforce-version: ${{ vars.SF_CLI_VERSION }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.CI_USER_REPO_ACCESS_TOKEN }}

      - name: 🗣️ Echo important data 📣
        id: echo-data
        run: |
          echo "🚨 COMMIT_SHA: ${{ github.sha }} 🚨"
          echo "GIT_BRANCH: $GIT_BRANCH"
          echo "PACKAGE_VERSION: $PACKAGE_VERSION"
          echo "SUBSCRIBER_PACKAGE_ID: $SUBSCRIBER_PACKAGE_ID"
          echo "PACKAGE_NAME: $PACKAGE_NAME"
          echo "REPO_NAME: $REPO_NAME"
          echo "Jira Ticket IDs: $JIRA_TICKET_IDS"
        env:
          JIRA_TICKET_IDS: ${{ needs.Sync-And-Transition-Tickets.outputs.jira-ticket-ids }}

      - name: 🗑️ Remove unchanged flows 🗑️
        run: $DELIVERY_SCRIPTS_PATH/remove_unchanged_flows.py
        env:
          COMMIT_SHA1: ${{ github.sha }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: 📦 Auth to packaging org 📦
        run: |
          echo "$PACKAGING_ORG_AUTH_URL" >auth.key
          sf auth sfdxurl store --sfdx-url-file auth.key --set-default
          rm auth.key
        env:
          PACKAGING_ORG_AUTH_URL: ${{ secrets.PACKAGING_ORG_AUTH_URL }}

      - name: 🔐 Enforce platform encryption 🚓
        run: $DELIVERY_SCRIPTS_PATH/enforce_platform_encryption.py
        env:
          CODEBUILD_URL: ${{ env.BUILD_LINK }}
          DEVOPS_SCRIPTS_PATH: '.'
          PLATFORM_ENCRYPTION_FAILURE_NOTIFICATION_CHANNEL: devops-alerts
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🆙 Update deps in packaging org 🆙
        run: |
          username=$(sf org display --json | jq -r '.result.username')
          ncino package install -o $username -w -1
        env:
          SFTD_API_KEY: ${{ secrets.SFTD_API_KEY }}

      - name: Running flow version notifications
        run: |
          pip install defusedxml
          $DELIVERY_SCRIPTS_PATH/flow_version_notifications.py

      - name: 🪄 Convert source to metadata format 🤹‍♂️
        id: convert-source
        run: $DELIVERY_SCRIPTS_PATH/convert-source-to-mdapi.sh
        env:
          POST_INSTALL_CLASS: PackageDataInstaller

      - name: 🗄️ Upload package.xml artifact 📂
        if: steps.convert-source.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-package-xml
          path: src/package.xml

      - name: 🚀 Deploy to packaging org 🚀
        id: deploy-metadata
        uses: ncino/action-swordfish/deploy-metadata@v1
        with:
          metadata-dir: src/

      - name: ❗🔔 Send Deployment Failure Notifications
        uses: ncino/action-slack-notification@v2
        id: deployment-failure-notification
        if: always() && steps.deploy-metadata.outcome == 'failure'
        with:
          slack-app-token: ${{ secrets.DELIVERY_SLACK_APP_TOKEN }}
          slack-channel-name: ${{ env.FAILURE_SLACK_CHANNEL }}
          slack-blocks: ${{ steps.deploy-metadata.outputs.failure-message-blocks }}

      - name: 🔼 Upload package in packaging org 🔼
        id: upload-package
        uses: ncino/action-swordfish/upload-package@v1
        with:
          packaging-org-auth-url: ${{ secrets.PACKAGING_ORG_AUTH_URL }}
          subscriber-package-id: ${{ env.SUBSCRIBER_PACKAGE_ID }}
          version: ${{ needs.Sync-And-Transition-Tickets.outputs.tag }}

      - name: ❗🔔 Package Upload Failure Notifications
        id: upload-failure-notification
        uses: ncino/action-slack-notification@v2
        if: always() && steps.upload-package.outcome == 'failure'
        with:
          slack-app-token: ${{ secrets.DELIVERY_SLACK_APP_TOKEN }}
          slack-channel-name: ${{ env.FAILURE_SLACK_CHANNEL }}
          slack-blocks: ${{ steps.upload-package.outputs.failure-message-blocks }}

  Update-Release:
    name: 🎉 Create Release and Transition to Verification
    runs-on: ubuntu-latest
    needs: [Get-Package-Info, Package-Create, Sync-And-Transition-Tickets]
    env:
      PACKAGE_LABEL: ${{ needs.Get-Package-Info.outputs.package-name }} ${{ needs.Sync-And-Transition-Tickets.outputs.tag }}
      PACKAGE_NAME: ${{ needs.Get-Package-Info.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.Sync-And-Transition-Tickets.outputs.tag }}
      SUBSCRIBER_PACKAGE_ID: ${{ needs.Get-Package-Info.outputs.subscriber-package-id }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 🎥 Create Records 🎥
        id: create-records
        uses: ncino/action-swordfish/release@v1
        with:
          spa-api-key: ${{ secrets.SPA_API_KEY }}
          spa-api-url: ${{ vars.SPA_API_URL }}
          subscriber-package-id: ${{ env.SUBSCRIBER_PACKAGE_ID }}
          version: ${{ env.PACKAGE_VERSION }}
          commit-sha: ${{ github.sha }}
          github-token: ${{ steps.app-token.outputs.token }}
          generate-release-notes: true
          package-version-info: ${{ needs.Package-Create.outputs.package-version-info }}
          sfdx-project-json: ${{ needs.Get-Package-Info.outputs.sfdx-project-json }}

      - name: 🪬 Transition Jira Tickets to Verification
        uses: ncino/action-jira-transition@v1
        env:
          JIRA_TRANSITION_WEBHOOK: ${{ secrets.JIRA_TRANSITION_WEBHOOK }}
          JIRA_TRANSITION_SECRET: ${{ secrets.JIRA_TRANSITION_SECRET }}
          RELEASE_FULLNAME: ${{ env.PACKAGE_NAME }}
        with:
          issue-ids: ${{ needs.Sync-And-Transition-Tickets.outputs.jira-ticket-ids }}
          new-status: 'Verification'

      - name: ✅🔎 Send Success QA Notifications
        id: success-notification
        uses: ncino/action-slack-notification@v2
        with:
          slack-app-token: ${{ secrets.DELIVERY_SLACK_APP_TOKEN }}
          slack-channel-name: ${{ env.QA_SLACK_CHANNEL }}
          slack-blocks: ${{ steps.create-records.outputs.success-message-blocks }}

  Add-To-Release:
    name: 🚚 Add to Release 🚚
    needs: [Package-Create, Update-Release]
    uses: ./.github/workflows/add-to-release.yml
    if: ${{ vars.ADD_PACKAGE_VERSION_TO_RELEASE != 'false' }}
    with:
      metadata-package-version-id: ${{ fromJSON(needs.Package-Create.outputs.package-version-info).Id }}
    secrets: inherit
