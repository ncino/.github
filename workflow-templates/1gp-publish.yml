#* This workflow will run when a dev-branch is merged into the release branch. Jobs run in following order:
#*   1. commit-lint: checks commit messages for semantic release.
#*   2. swordfish: Determines the version and transitions tickets to packaging.
#*   3. publish-package: deploys the package to the packaging org.
#*   4. release: Publishes the release and transitions tickets to verification

name: 📚 1GP Publish 📝
on:
  push:
    branches:
      - release

env:
  COMMIT_SHA1: ${{ github.sha }}
  DELIVERY_SCRIPTS_PATH: "./devops-utility-belt/scripts"
  GIT_BRANCH: ${{ github.ref_name }}
  REPO_NAME: ${{ github.event.repository.name }}
  QA_SLACK_CHANNEL: "qa-notifications"
  FAILURE_SLACK_CHANNEL: "oof"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ####################################
  ######## 📝 Commit Lint 📝 #########
  ####################################
  Commit-Lint:
    name: 📝 Commit Lint 📝
    uses: ./.github/workflows/commit-lint.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write

  ###################################
  ######## Get Package Info #########
  ###################################
  Get-Package-Info:
    name: Get Package Info
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.get-package-info.outputs.package-name }}
      package-namespace: ${{ steps.get-package-info.outputs.package-namespace }}
      subscriber-package-id: ${{ steps.get-package-info.outputs.subscriber-package-id }}
      sfdx-project-json: ${{ steps.get-package-info.outputs.sfdx-project-json }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: Checkout Release
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: "sfdx-project.json"

      - name: Get Package Info
        id: get-package-info
        run: |
          set -e
          echo "package-name=$(jq -r '.name' sfdx-project.json)" >> $GITHUB_OUTPUT
          echo "package-namespace=$(jq -r '.namespace' sfdx-project.json)" >> $GITHUB_OUTPUT
          echo "subscriber-package-id=$(jq -r '.plugins.subscriberPackageId' sfdx-project.json)" >> $GITHUB_OUTPUT
          echo "sfdx-project-json=$(jq . -cr sfdx-project.json)" >> $GITHUB_OUTPUT

      - name: Print Package Info
        run: |
          echo "PACKAGE_NAME: $PACKAGE_NAME"
          echo "PACKAGE_NAMESPACE: $PACKAGE_NAMESPACE"
          echo "SUBSCRIBER_PACKAGE_ID: $SUBSCRIBER_PACKAGE_ID"
          echo "SFDX_PROJECT_JSON: $SFDX_PROJECT_JSON"
        env:
          PACKAGE_NAME: ${{ steps.get-package-info.outputs.package-name }}
          PACKAGE_NAMESPACE: ${{ steps.get-package-info.outputs.package-namespace }}
          SUBSCRIBER_PACKAGE_ID: ${{ steps.get-package-info.outputs.subscriber-package-id }}
          SFDX_PROJECT_JSON: ${{ steps.get-package-info.outputs.sfdx-project-json }}

  ##########################################################
  ######## 🐠⚔︎ Transition Tickets to Packaging 🐠⚔︎ #########
  ##########################################################
  swordfish:
    name: ⚔️🐠 Transition to Packaging ⚔️🐠
    needs: [commit-lint]
    if: needs.commit-lint.outputs.release != 'NONE'
    runs-on: ubuntu-latest
    outputs:
      jira-ticket-ids: ${{ steps.parse-inputs.outputs.jira-ticket-ids }}
      tag: ${{ steps.swordfish-synchronizer.outputs.next-version }}

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: Checkout Release
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: ⚔️🐠 Swordfish Synchronizer ⚔️🐠
        id: swordfish-synchronizer
        uses: ncino/action-swordfish/synchronizer@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          packaging-org-auth-url: ${{ secrets.PACKAGING_ORG_AUTH_URL }}
          namespace-prefix: ${{ needs.Get-Package-Info.outputs.package-namespace }}
          spa-api-key: ${{ secrets.SPA_API_KEY }}
          spa-api-url: ${{ vars.SPA_API_URL }}

      - name: Print Outputs
        run: |
          echo "Previous Version was $PREVIOUS_VERSION"
          echo "Next Version is $NEXT_VERSION"
        env:
          PREVIOUS_VERSION: ${{ steps.swordfish-synchronizer.outputs.previous-version }}
          NEXT_VERSION: ${{ steps.swordfish-synchronizer.outputs.next-version }}

      - name: Run the Jira parsing action
        id: parse-inputs
        uses: ncino/action-jira-issue-parser@v3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          jira-user: ${{ secrets.JIRA_USER }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          jira-base-url: ${{ vars.ATLASSIAN_BASE_URL }}
          previous-release: ${{ steps.swordfish-synchronizer.outputs.previous-version }}

      - name: 🪬 Transition Jira Tickets
        uses: ncino/action-jira-transition@v1
        env:
          JIRA_TRANSITION_WEBHOOK: ${{ secrets.JIRA_TRANSITION_WEBHOOK }}
          JIRA_TRANSITION_SECRET: ${{ secrets.JIRA_TRANSITION_SECRET }}
          RELEASE_FULLNAME: ${{ needs.Get-Package-Info.outputs.package-name }}
        with:
          issue-ids: ${{ steps.parse-inputs.outputs.jira-ticket-ids }}
          new-status: "Packaging"

  #########################################################
  ######## 🚀 Publish Package to Packaging Org 🚀 #########
  #########################################################
  Publish-Package:
    name: 🚀 Publish Package to Packaging Org 🚀
    needs: [swordfish]
    outputs:
      package-version-info: ${{ steps.upload-package.outputs.package-version-info }}
    runs-on: ubuntu-latest
    env:
      BUILD_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PACKAGE_NAME: ${{ needs.Get-Package-Info.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.Swordfish.outputs.tag }}
      PACKAGE_LABEL: ${{ needs.Get-Package-Info.outputs.package-name }} ${{ needs.Swordfish.outputs.tag }}
      SUBSCRIBER_PACKAGE_ID: ${{ needs.Get-Package-Info.outputs.subscriber-package-id }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 🛠️ Force Repository Setup 🛠️
        uses: ncino/action-force-setup@v4
        with:
          ci-github-app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          ci-github-app-private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}
          ci-ncino-ssh-private-signing-key: ${{ secrets.CI_NCINO_SSH_PRIVATE_SIGNING_KEY }}
          ci-ncino-ssh-public-signing-key: ${{ secrets.CI_NCINO_SSH_PUBLIC_SIGNING_KEY }}
          dev-hub-auth-url: ${{ secrets.DEVOPS_DEV_HUB_AUTH_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}

      - name: 🗣️ Echo important data 📣
        id: echo-data
        run: |
          echo "🚨 COMMIT_SHA: $COMMIT_SHA1 🚨"
          echo "GIT_BRANCH: $GIT_BRANCH"
          echo "PACKAGE_VERSION: $PACKAGE_VERSION"
          echo "SUBSCRIBER_PACKAGE_ID: $SUBSCRIBER_PACKAGE_ID"
          echo "REPO_NAME: $REPO_NAME"
          echo "Jira Ticket IDs: $JIRA_TICKET_IDS"
        env:
          JIRA_TICKET_IDS: ${{ needs.Swordfish.outputs.jira-ticket-ids }}

      - name: 🗑️ Remove unchanged flows 🗑️
        run: $DELIVERY_SCRIPTS_PATH/remove_unchanged_flows.py
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: 📦 Auth to packaging org 📦
        run: |
          echo "$PACKAGING_ORG_AUTH_URL" >auth.key
          sf auth sfdxurl store --sfdx-url-file auth.key --set-default
          rm auth.key
        env:
          PACKAGING_ORG_AUTH_URL: ${{ secrets.PACKAGING_ORG_AUTH_URL }}

      - name: 🔐 Enforce platform encryption 🚓
        run: $DELIVERY_SCRIPTS_PATH/enforce_platform_encryption.py
        env:
          CODEBUILD_URL: ${{ env.BUILD_LINK }}
          DEVOPS_SCRIPTS_PATH: "."
          PLATFORM_ENCRYPTION_FAILURE_NOTIFICATION_CHANNEL: devops-alerts
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🆙 Update deps in packaging org 🆙
        run: |
          npm install -g @ncino/cli
          username=$(sf org display --json | jq -r '.result.username')
          ncino package install -o $username -w -1
        env:
          GITHUB_TOKEN: ${{ secrets.CI_USER_REPO_ACCESS_TOKEN }}
          SFTD_API_KEY: ${{ secrets.SFTD_API_KEY }}

      - name: ✔︎ Validate XML
        uses: ncino/action-validate-xml@v1

      - name: 🪄 Convert source to metadata format 🤹‍♂️
        id: convert-source
        run: |
          jq -r '.packageDirectories[] | select(.default == true)' sfdx-project.json >defaultPackage.json
          srcPath=$(jq -r '.path' defaultPackage.json)
          packageName=$(jq -r '.package' defaultPackage.json)
          mkdir dx && mv $srcPath dx/ && rm -rf src/unpackaged defaultPackage.json
          sed -i -e "s/src/dx/" sfdx-project.json
          sed -i -e "s/src/dx/" .forceignore
          sf project convert source --root-dir dx/ --output-dir src/ --package-name "$packageName"
          sed -i -e "s/<fullName>/<postInstallClass>$POST_INSTALL_CLASS<\/postInstallClass><fullName>/" src/package.xml
          package-xml-corrector
          mv config/destructiveChanges*.xml src/
          echo "status=success" >> $GITHUB_OUTPUT
        env:
          POST_INSTALL_CLASS: "DataInstaller_v1"

      - name: 🗄️ Upload package.xml artifact 📂
        if: steps.convert-source.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ncino-package-xml
          path: src/package.xml

      - name: 🚀 Deploy to packaging org 🚀
        id: deploy-to-packaging-org
        run: sf project deploy start --metadata-dir src/ --wait 400 --ignore-warnings --verbose

      - name: 🔎 Send deploy failure notification
        uses: ncino/action-slack-notification@v1
        if: always() && steps.deploy-to-packaging-org.outcome != 'success'
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          slack-channel-name: ${{ env.FAILURE_SLACK_CHANNEL }}
          slack-message: "${{ env.MESSAGE }}\n🔗🌐 Build Link: ${{ env.BUILD_LINK }}"
        env:
          MESSAGE: "❗️📦 Package creation for ${{ env.PACKAGE_LABEL }} failed on the package deployment step."

      - name: 🔼 Upload package in packaging org 🔼
        id: upload-package
        uses: ncino/action-swordfish/upload-package@v1
        with:
          packaging-org-auth-url: ${{ secrets.PACKAGING_ORG_AUTH_URL }}
          subscriber-package-id: ${{ env.SUBSCRIBER_PACKAGE_ID }}
          version: ${{ env.PACKAGE_VERSION }}

      - name: 🔎 Send upload failure notification
        uses: ncino/action-slack-notification@v1
        if: always() && steps.upload-package.outcome != 'success'
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          slack-channel-name: ${{ env.FAILURE_SLACK_CHANNEL }}
          slack-message: "${{ env.MESSAGE }}\n🔗🌐 Build Link: ${{ env.BUILD_LINK }}"
        env:
          MESSAGE: "❗️📦 Package creation for ${{ env.PACKAGE_LABEL }} failed on the package upload step."

  ###################################################
  ######## 🎊 Transition to Verification 🎉 #########
  ###################################################
  Update-Release:
    name: 🎉 Create Release and Transition to Verification
    runs-on: ubuntu-latest
    needs: [Publish-Package, Swordfish, Get-Package-Info]
    env:
      PACKAGE_NAME: ${{ needs.Get-Package-Info.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.Swordfish.outputs.tag }}
      PACKAGE_LABEL: ${{ needs.Get-Package-Info.outputs.package-name }} ${{ needs.Swordfish.outputs.tag }}
      SUBSCRIBER_PACKAGE_ID: ${{ needs.Get-Package-Info.outputs.subscriber-package-id }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.NCINO_CI_GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.NCINO_CI_GH_APP_SSH_PRIVATE_KEY }}

      - name: 🗃️ Checkout Repo 🗃️
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 🎥 Create Records 🎥
        id: create-records
        uses: ncino/action-swordfish/release@v1
        with:
          spa-api-key: ${{ secrets.SPA_API_KEY }}
          spa-api-url: ${{ vars.SPA_API_URL }}
          subscriber-package-id: ${{ env.SUBSCRIBER_PACKAGE_ID }}
          version: ${{ env.PACKAGE_VERSION }}
          commit-sha: ${{ env.COMMIT_SHA1 }}
          github-token: ${{ steps.app-token.outputs.token }}
          generate-release-notes: true
          package-version-info: ${{ needs.Publish-Package.outputs.package-version-info }}
          sfdx-project-json: ${{ needs.Get-Package-Info.outputs.sfdx-project-json }}

      - name: 🪬 Transition Jira Tickets
        uses: ncino/action-jira-transition@v1
        env:
          JIRA_TRANSITION_WEBHOOK: ${{ secrets.JIRA_TRANSITION_WEBHOOK }}
          JIRA_TRANSITION_SECRET: ${{ secrets.JIRA_TRANSITION_SECRET }}
          RELEASE_FULLNAME: ${{ env.PACKAGE_NAME }}
        with:
          issue-ids: ${{ needs.Swordfish.outputs.jira-ticket-ids }}
          new-status: "Verification"

      - name: ✅🔎 Send Success QA Notifications
        uses: ncino/action-slack-notification@v1
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          slack-channel-name: ${{ env.QA_SLACK_CHANNEL }}
          slack-message: "${{ env.MESSAGE }}\n 🔗🌐 Release Summary: ${{ env.RELEASE_LINK }}\n ${{ env.PLM_RECORD }}"
        env:
          MESSAGE: "✅📦 Package creation for ${{ env.PACKAGE_LABEL }} succeeded"
          RELEASE_LINK: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.PACKAGE_VERSION }}
          PLM_RECORD: "🔗🌐 PLM Record: ${{ steps.create-records.outputs.plm-record-url }}"

  Add-To-Release:
    name: 🚚 Add to Release 🚚
    needs: [Publish-Package, Update-Release]
    uses: ./.github/workflows/add-to-release.yml
    if: ${{ vars.ADD_PACKAGE_VERSION_TO_RELEASE == 'true' }}
    with:
      metadata-package-version-id: ${{ fromJSON(needs.Publish-Package.outputs.package-version-info).Id }}
    secrets: inherit
